const $=id=>document.getElementById(id);
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const szl=p=>p.sz?" ("+CONFIG.sizes[p.sz][lang]+")":"";const nm=p=>(lang==="bn"?p.bn:p.en)+szl(p);

function act(id){const n=cart[id]||0;return n?`<div class="step"><button data-dec="${id}" aria-label="−">−</button><span>${n}</span><button data-inc="${id}" aria-label="+">+</button></div>`:`<button class="add" data-add="${id}">${t("add")}</button>`}

 return `<article class="card"><div class="im" data-qv="${p.id}" style="cursor:pointer">${pic(p.img,p.e,nm(p))}${off?`<b class="bd">−${off}%</b>`:""}<button class="fav${W[p.id]?" on":""}" data-fav="${p.id}" aria-pressed="${!!W[p.id]}" aria-label="Save">${W[p.id]?"♥":"♡"}</button></div><h3 data-qv="${p.id}" style="cursor:pointer">${esc(nm(p))}</h3><small>${unit(p)}</small>${p.sizes?`<div class="szs" role="group">${Object.keys(CONFIG.sizes).map(z=>`<button class="sz${k.endsWith("|"+z)?" on":""}" data-sz="${p.id}|${z}">${CONFIG.sizes[z][lang]}</button>`).join("")}</div>`:""}<div class="pr"><strong>${money(v.p)}</strong>${v.old?`<s>${money(v.old)}</s>`:""}</div><div class="act" data-a="${k}">${act(k)}</div></article>`}
function list(){let a=PRODUCTS.filter(p=>(cat==="all"||p.cat===cat)&&(!onlySaved||W[p.id])&&(!q||(p.en+" "+p.bn).toLowerCase().includes(q)));

function cdisc(sub){const c=CONFIG.coupons&&CONFIG.coupons[coupon];if(!c||sub<(c.min||0))return 0;return Math.min(sub,c.pct?Math.round(sub*c.pct/100):c.off)}

 const pick=$("dm").value==="Pickup from store";
 const ex=$("dm").value==="Express delivery",fee=(!cnt||pick)?0:((sub>=CONFIG.freeOver?0:CONFIG.deliveryFee)+(ex?CONFIG.expressFee:0));
 const disc=cdisc(sub);return{sub,cnt,fee,disc,total:sub-disc+fee,pick}}
function renderCart(){const T=totals(),ids=Object.keys(cart);
 $("items").innerHTML=ids.length?ids.map(id=>{const p=PM[id],n=cart[id];return `<li>${pic(p.img,p.e,nm(p))}<div><b>${esc(nm(p))}</b><small>${money(p.p)} · ${unit(p)}</small></div><div class="ln">${money(p.p*n)}<div class="step"><button data-dec="${id}" aria-label="−">−</button><span>${n}</span><button data-inc="${id}" aria-label="+">+</button></div></div></li>`}).join(""):`<li style="display:block" class="mut">${t("empty")}</li>`;
